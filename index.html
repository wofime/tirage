<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirage au Sort Anime & Manga</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #121212;
      color: #ffffff;
      border-radius: 8px;
    }
    h1, h2 { text-align: center; color: #00d46a; }
    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 10px;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #333;
      padding: 10px;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #00d46a;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #00b359; }
    .result-box {
      margin-top: 20px;
      padding: 15px;
      background: #1e1e1e;
      border-radius: 6px;
    }
    .winner {
      font-size: 26px;
      font-weight: bold;
      color: #ffcc00;
      text-align: center;
      margin: 15px 0;
      min-height: 35px;
    }
    a.vinted-btn {
      display: block;
      text-align: center;
      background: #007787;
      color: white;
      text-decoration: none;
      padding: 10px;
      border-radius: 4px;
      font-weight: bold;
      margin-top: 10px;
    }
    a.vinted-btn:hover { background: #005f6c; }
    ul { padding-left: 20px; }
    li { margin-bottom: 6px; font-size: 16px; }
  </style>
</head>
<body>

  <h1>🎲 Tirage au Sort Anime & Manga</h1>

  <label for="propositions">Entrez les propositions (séparées par des virgules) :</label>
  <textarea id="propositions" placeholder="Ex: SNK, Naruto, Attack on Titan, AOT, MHA, My Hero Academia..."></textarea>

  <button onclick="traiterEtTirer()">Trier avec Groq & Lancer le Tirage</button>

  <div id="statut" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>

  <div id="resultat" class="result-box" style="display: none;">
    <h2>📋 Liste nettoyée (sans doublons) :</h2>
    <ul id="listeNettoyee"></ul>

    <hr style="border-color: #333; margin: 20px 0;">

    <h2>🎉 Résultat du Tirage au Sort :</h2>
    <div id="gagnant" class="winner"></div>
    <div id="lienVintedContainer"></div>
  </div>

  <script>
    // ⚠️ Ta clé API Groq mise en dur
    const GROQ_API_KEY = "gsk_VOTRE_CLE_GROQ_ICI";

    async function unifierEtFiltrerPropositions(listePropositions) {
      const systemPrompt = `Tu es un expert en mangas et animés, spécialisé dans la normalisation de données.
Ta tâche est d'analyser une liste de propositions d'utilisateurs et de :
1. Identifier les synonymes, acronymes et traductions (ex: "SNK", "AOT", "Attack on Titan", "Shingeki no Kyojin" -> "L'Attaque des Titans").
2. Regrouper toutes les variantes sous LE titre officiel le plus courant en français.
3. Ne garder QU'UNE SEULE occurrence par œuvre unique.
4. Répondre STRICTEMENT avec un tableau JSON de chaînes de caractères (strings), sans formatage Markdown, sans explications.

Exemple d'entrée : ["SNK", "Naruto", "Attack on Titan", "aot", "Shingeki no Kyojin"]
Exemple de sortie attendue : ["L'Attaque des Titans", "Naruto"]`;

      const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${GROQ_API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile",
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: `Propositions à unifier : ${JSON.stringify(listePropositions)}` }
          ],
          temperature: 0.1
        })
      });

      const data = await response.json();
      let texteBrut = data.choices[0].message.content.trim();
      
      // Nettoyage au cas où Groq ajoute des balises Markdown ```json
      texteBrut = texteBrut.replace(/^```json\s*/, '').replace(/\s*```$/, '');
      
      return JSON.parse(texteBrut);
    }

    async function traiterEtTirer() {
      const input = document.getElementById("propositions").value;
      const statut = document.getElementById("statut");
      const divResultat = document.getElementById("resultat");
      const divGagnant = document.getElementById("gagnant");
      const containerVinted = document.getElementById("lienVintedContainer");
      
      if (!input.trim()) {
        alert("Veuillez entrer au moins une proposition !");
        return;
      }

      // 1. Découpage du texte par virgules
      const propositionsBrutes = input.split(",").map(p => p.trim()).filter(p => p.length > 0);

      statut.innerText = "⏳ Analyse et regroupement des doublons avec Groq...";
      divResultat.style.display = "none";
      containerVinted.innerHTML = "";

      try {
        // 2. Nettoyage via Groq
        const listeNettoyee = await unifierEtFiltrerPropositions(propositionsBrutes);

        // 3. Affichage de la liste nettoyée
        const ul = document.getElementById("listeNettoyee");
        ul.innerHTML = "";
        listeNettoyee.forEach(item => {
          const li = document.createElement("li");
          li.innerText = item;
          ul.appendChild(li);
        });

        statut.innerText = "";
        divResultat.style.display = "block";

        // 4. Animation du tirage au sort aléatoire parmi la liste
        let tours = 0;
        const maxTours = 20; // Nombre de défilements avant de s'arrêter
        const intervalle = setInterval(() => {
          const indexTemp = Math.floor(Math.random() * listeNettoyee.length);
          divGagnant.innerText = listeNettoyee[indexTemp];
          tours++;

          if (tours >= maxTours) {
            clearInterval(intervalle);
            
            // Choix du gagnant final
            const indexGagnant = Math.floor(Math.random() * listeNettoyee.length);
            const oeuvregagnante = listeNettoyee[indexGagnant];
            divGagnant.innerText = "🏆 " + oeuvregagnante;

            // 5. Lien Vinted sur le résultat final
            const urlVinted = `[https://www.vinted.fr/catalog?search_text=$](https://www.vinted.fr/catalog?search_text=$){encodeURIComponent(oeuvregagnante)}`;
            containerVinted.innerHTML = `
              <a class="vinted-btn" href="${urlVinted}" target="_blank">
                🔍 Chercher "${oeuvregagnante}" sur Vinted
              </a>
            `;
          }
        }, 100);

      } catch (erreur) {
        console.error(erreur);
        statut.innerText = "❌ Erreur lors du traitement par Groq. Vérifie ta clé API ou la console.";
      }
    }
  </script>
</body>
</html>
