<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirage au Sort</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card);
      width: 100%;
      max-width: 450px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      text-align: center;
    }

    p.subtitle {
      color: var(--subtext);
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      background-color: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    .btn-draw {
      width: 100%;
      background-color: #10b981;
      font-size: 1.1rem;
      padding: 14px;
      margin-bottom: 20px;
    }

    .btn-draw:hover {
      background-color: #059669;
    }

    .winner-box {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
      display: none;
    }

    .winner-box h2 {
      font-size: 1.2rem;
      color: #34d399;
      margin-bottom: 4px;
    }

    .winner-name {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .list-title {
      font-size: 0.9rem;
      color: var(--subtext);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    ul {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    li {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    li:last-child {
      border-bottom: none;
    }

    .empty-msg {
      padding: 14px;
      color: var(--subtext);
      text-align: center;
      font-style: italic;
    }

    .footer-actions {
      margin-top: 20px;
      text-align: center;
    }

    .btn-reset {
      background: transparent;
      color: #ef4444;
      font-size: 0.8rem;
      text-decoration: underline;
      padding: 0;
    }

    .btn-reset:hover {
      background: transparent;
      color: #dc2626;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎲 Tirage au Sort</h1>
    <p class="subtitle">Faites vos propositions, puis tirez au sort !</p>

    <div id="winnerBox" class="winner-box">
      <h2>🎉 Résultat du Tirage</h2>
      <div id="winnerName" class="winner-name">...</div>
    </div>

    <form id="propForm" class="form-group">
      <input type="text" id="propInput" placeholder="Votre proposition..." required>
      <button type="submit">Ajouter</button>
    </form>

    <button id="drawBtn" class="btn-draw">🎯 Tirer au sort</button>

    <div class="list-title">Propositions enregistrées (<span id="count">0</span>)</div>
    <ul id="propList">
      <li class="empty-msg">Chargement...</li>
    </ul>

    <div class="footer-actions">
      <button id="resetBtn" class="btn-reset">Réinitialiser tout le tirage</button>
    </div>
  </div>

  <script>
    const API_URL = "https://api.npoint.io/a690eb604cfe91d995e2";

    const propForm = document.getElementById('propForm');
    const propInput = document.getElementById('propInput');
    const propList = document.getElementById('propList');
    const countSpan = document.getElementById('count');
    const drawBtn = document.getElementById('drawBtn');
    const winnerBox = document.getElementById('winnerBox');
    const winnerName = document.getElementById('winnerName');
    const resetBtn = document.getElementById('resetBtn');

    // Récupérer les données depuis l'API
    async function fetchData() {
      try {
        const res = await fetch(API_URL);
        return await res.json();
      } catch (err) {
        console.error("Erreur API :", err);
      }
    }

    // Sauvegarder les données vers l'API
    async function saveData(data) {
      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
      } catch (err) {
        console.error("Erreur de sauvegarde :", err);
      }
    }

    // Mettre à jour l'affichage sur la page
    async function updateUI() {
      const data = await fetchData();
      if (!data) return;

      // Affichage de la liste
      propList.innerHTML = "";
      const props = data.propositions || [];
      countSpan.textContent = props.length;

      if (props.length === 0) {
        propList.innerHTML = '<li class="empty-msg">Aucune proposition pour l\'instant.</li>';
      } else {
        props.forEach(item => {
          const li = document.createElement('li');
          li.textContent = item;
          propList.appendChild(li);
        });
      }

      // Affichage de l'état du tirage
      if (data.tire) {
        winnerName.textContent = data.gagnant;
        winnerBox.style.display = "block";
        drawBtn.style.display = "none";
        propForm.style.display = "none";
      } else {
        winnerBox.style.display = "none";
        drawBtn.style.display = "block";
        propForm.style.display = "flex";
      }
    }

    // Ajouter une proposition
    propForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = propInput.value.trim();
      if (!text) return;

      const data = await fetchData();
      data.propositions.push(text);
      await saveData(data);

      propInput.value = "";
      updateUI();
    });

    // Effectuer le tirage
    drawBtn.addEventListener('click', async () => {
      const data = await fetchData();

      if (data.tire) {
        alert("Le tirage a déjà été effectué !");
        return;
      }

      if (!data.propositions || data.propositions.length === 0) {
        alert("Ajoutez au moins une proposition avant de tirer !");
        return;
      }

      const index = Math.floor(Math.random() * data.propositions.length);
      data.gagnant = data.propositions[index];
      data.tire = true;

      await saveData(data);
      updateUI();
    });

    // Réinitialiser tout
    resetBtn.addEventListener('click', async () => {
      if (confirm("Voulez-vous vraiment effacer toutes les propositions et réinitialiser le tirage ?")) {
        const emptyData = { propositions: [], tire: false, gagnant: "" };
        await saveData(emptyData);
        updateUI();
      }
    });

    // Rafraîchissement automatique toutes les 3 secondes pour la synchro à distance
    setInterval(updateUI, 3000);

    // Premier chargement
    updateUI();
  </script>
</body>
</html>
