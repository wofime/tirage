<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tirage au sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #140e2b;
    --ink-2: #1d1540;
    --panel: rgba(255,255,255,.06);
    --line: rgba(255,255,255,.13);
    --text: #f6f1ff;
    --muted: #b3a8d6;
    --coral: #ff5d8f;
    --gold: #ffc65c;
    --mint: #6ee7c8;
    --display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
    --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    font-family: var(--body); color: var(--text); min-height: 100vh; min-height: 100dvh;
    display: flex; justify-content: center; align-items: flex-start; padding: 28px 16px 48px;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(255,93,143,.28), transparent 60%),
      radial-gradient(700px 500px at -10% 40%, rgba(110,231,200,.14), transparent 60%),
      radial-gradient(800px 600px at 50% 120%, rgba(255,198,92,.16), transparent 60%),
      var(--ink);
    background-attachment: fixed;
  }
  main { width: 100%; max-width: 480px; }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 8vw, 2.7rem); letter-spacing: -.03em; line-height: 1; }
  .subtitle { color: var(--muted); margin: 10px 0 24px; line-height: 1.5; }

  /* Scène du tirage : l'élément mémorable */
  .stage {
    position: relative; overflow: hidden; text-align: center; border-radius: 28px;
    padding: 34px 20px 30px; min-height: 190px; display: flex; flex-direction: column; justify-content: center; gap: 10px;
    background: linear-gradient(160deg, var(--ink-2), #2a1659 70%, #3b1a63);
    border: 1px solid var(--line);
    box-shadow: 0 24px 60px -20px rgba(255,93,143,.45), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .stage::before, .stage::after {
    content: ""; position: absolute; top: 50%; width: 14px; height: 28px; margin-top: -14px;
    background: var(--ink); border: 1px solid var(--line);
  }
  .stage::before { left: -1px; border-radius: 0 28px 28px 0; border-left: 0; }
  .stage::after { right: -1px; border-radius: 28px 0 0 28px; border-right: 0; }
  .stage-label { color: var(--muted); font-size: .95rem; }
  .stage-name {
    font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 9vw, 3rem);
    line-height: 1.05; letter-spacing: -.03em; overflow-wrap: anywhere; color: var(--text);
  }
  .stage.idle .stage-name { color: rgba(255,255,255,.28); }
  .stage.rolling .stage-name { animation: tick .09s ease-out; }
  .stage.won { border-color: rgba(255,198,92,.6); box-shadow: 0 24px 70px -18px rgba(255,198,92,.55), inset 0 1px 0 rgba(255,255,255,.2); }
  .stage.won .stage-name {
    background: linear-gradient(100deg, var(--gold), #fff1c9 45%, var(--coral));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: pop .6s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes tick { from { transform: translateY(-14px); opacity: .3; } to { transform: none; opacity: 1; } }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }

  .btn-draw {
    width: 100%; margin-top: 16px; padding: 17px; border: 0; border-radius: 18px; cursor: pointer;
    font: 800 1.15rem var(--display); letter-spacing: -.01em; color: #2a0f1c;
    background: linear-gradient(100deg, var(--gold), var(--coral));
    box-shadow: 0 12px 30px -10px rgba(255,93,143,.7);
    transition: transform .15s, box-shadow .15s, filter .15s;
  }
  .btn-draw:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .btn-draw:active { transform: translateY(1px) scale(.99); }

  .panel { margin-top: 22px; padding: 18px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); }
  .form-group { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1; min-width: 0; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line);
    background: rgba(10,6,28,.55); color: var(--text); font: 1rem var(--body); outline: none; transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder { color: #8277ad; }
  input[type="text"]:focus { border-color: var(--mint); box-shadow: 0 0 0 4px rgba(110,231,200,.15); }
  .btn-add {
    padding: 0 20px; border: 0; border-radius: 14px; cursor: pointer; font: 700 .95rem var(--body);
    color: #06281f; background: var(--mint); transition: transform .15s, filter .15s;
  }
  .btn-add:hover { filter: brightness(1.08); transform: translateY(-1px); }

  .list-head { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 12px; }
  .list-head h2 { font: 800 1.05rem var(--display); letter-spacing: -.01em; }
  .count { min-width: 28px; padding: 3px 10px; text-align: center; border-radius: 99px; background: rgba(255,93,143,.2); color: #ffb3cb; font-weight: 700; font-size: .85rem; }
  .form-group + .list-head { margin-top: 20px; }
  .chips { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; max-height: 240px; overflow-y: auto; }
  .chip { padding: 8px 14px; border-radius: 99px; font-size: .93rem; background: rgba(255,255,255,.08); border: 1px solid var(--line); overflow-wrap: anywhere; animation: pop .35s ease-out; }
  .chip.win { background: linear-gradient(100deg, var(--gold), var(--coral)); color: #2a0f1c; font-weight: 700; border-color: transparent; }
  .empty-msg { color: var(--muted); line-height: 1.5; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
    padding: 12px 18px; border-radius: 14px; max-width: calc(100% - 32px); font-size: .92rem;
    background: #2b1d57; border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0,0,0,.4); transition: .25s;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast.bad { border-color: var(--coral); }

  .error { display: none; margin-bottom: 14px; padding: 10px 14px; border-radius: 12px; font-size: .88rem; color: #ffc2d4; background: rgba(255,93,143,.14); border: 1px solid rgba(255,93,143,.4); }
  button:disabled { opacity: .5; cursor: wait; transform: none; }
  button:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Tirage au sort</h1>
  <p class="subtitle">Ajoutez vos propositions, puis laissez le hasard choisir.</p>

  <div id="error" class="error">Connexion impossible, nouvel essai en cours…</div>

  <section id="stage" class="stage idle" aria-live="polite">
    <div id="stageLabel" class="stage-label">Le tirage n'a pas encore eu lieu</div>
    <div id="winnerName" class="stage-name">?</div>
  </section>

  <button id="drawBtn" class="btn-draw">Tirer au sort</button>

  <section class="panel">
    <form id="propForm" class="form-group">
      <input type="text" id="propInput" placeholder="Votre proposition…" maxlength="80" required autocomplete="off">
      <button type="submit" id="addBtn" class="btn-add">Ajouter</button>
    </form>
    <div class="list-head"><h2>Propositions</h2><span class="count" id="count">0</span></div>
    <ul id="propList" class="chips"><li class="empty-msg">Chargement…</li></ul>
  </section>

</main>
<div id="toast" class="toast" role="status"></div>
<canvas id="confetti"></canvas>

<script>
  const API_URL = "https://api.npoint.io/a690eb604cfe91d995e2";
  const $ = id => document.getElementById(id);
  const propForm = $('propForm'), propInput = $('propInput'), propList = $('propList'),
        countSpan = $('count'), drawBtn = $('drawBtn'), addBtn = $('addBtn'),
        stage = $('stage'), stageLabel = $('stageLabel'), winnerName = $('winnerName'),
        errorBox = $('error'), toastEl = $('toast');

  let busy = false, lastSnapshot = "", prevTire = null, toastTimer;

  function toast(msg, bad) {
    toastEl.textContent = msg;
    toastEl.className = "toast show" + (bad ? " bad" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
  }

  async function fetchData() {
    try {
      const res = await fetch(API_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const d = await res.json();
      errorBox.style.display = "none";
      return { propositions: Array.isArray(d.propositions) ? d.propositions : [], tire: !!d.tire, gagnant: d.gagnant || "" };
    } catch (err) {
      console.error("Erreur API :", err);
      errorBox.style.display = "block";
      return null;
    }
  }

  async function saveData(data) {
    try {
      const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
      if (!res.ok) throw new Error(res.status);
      return true;
    } catch (err) {
      console.error("Erreur de sauvegarde :", err);
      errorBox.style.display = "block";
      return false;
    }
  }

  function render(data) {
    const snapshot = JSON.stringify(data);
    if (snapshot === lastSnapshot) return;
    lastSnapshot = snapshot;

    propList.innerHTML = "";
    countSpan.textContent = data.propositions.length;
    if (data.propositions.length === 0) {
      propList.innerHTML = '<li class="empty-msg">Aucune proposition pour l\'instant. Ajoutez la première !</li>';
    } else {
      data.propositions.forEach(item => {
        const li = document.createElement('li');
        li.className = "chip" + (data.tire && item === data.gagnant ? " win" : "");
        li.textContent = item;
        propList.appendChild(li);
      });
    }

    if (data.tire) {
      stage.className = "stage won";
      stageLabel.textContent = "Et le gagnant est…";
      winnerName.textContent = data.gagnant;
      if (prevTire === false) burst();
    } else {
      stage.className = "stage idle";
      stageLabel.textContent = data.propositions.length ? "Prêt à tirer au sort" : "Le tirage n'a pas encore eu lieu";
      winnerName.textContent = "?";
    }
    prevTire = data.tire;
    drawBtn.style.display = data.tire ? "none" : "block";
    propForm.style.display = data.tire ? "none" : "flex";
  }

  async function updateUI() {
    if (busy) return;
    const data = await fetchData();
    if (data) render(data);
  }

  async function withLock(action) {
    if (busy) return;
    busy = true;
    [addBtn, drawBtn].forEach(b => b.disabled = true);
    try { await action(); }
    finally {
      busy = false;
      [addBtn, drawBtn].forEach(b => b.disabled = false);
    }
    await updateUI();
  }

  // Détection de doublons, même écrits différemment (IA Groq, repli local si indisponible)
  // >>> COLLE TA CLÉ GROQ ICI, entre les guillemets <<<
  const GROQ_KEY = "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";
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

  let aiError = "";
  async function findDuplicate(text, list) {
    aiError = "";
    const exact = list.find(p => norm(p) === norm(text));
    if (exact) return exact;
    if (!list.length || !GROQ_KEY.startsWith("gsk_")) return null; // sans clé valide : comparaison simple seulement
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 7000);
    try {
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST", signal: ctrl.signal,
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + GROQ_KEY },
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile", temperature: 0, response_format: { type: "json_object" },
          messages: [
            { role: "system", content: "Tu détectes les doublons dans une liste de propositions. Deux propositions sont des doublons si elles désignent la même chose, même écrites différemment : sigle ou acronyme et nom complet, abréviation, traduction dans une autre langue, nom original et nom localisé, surnom courant, faute de frappe, accents, pluriel. Exemples de doublons : « SNK », « AOT », « Attack on Titan », « L'Attaque des Titans » et « Shingeki no Kyojin » sont tous la même chose ; « JJK » = « Jujutsu Kaisen » ; « LOTR » = « Le Seigneur des anneaux ». Ne sont PAS des doublons deux choses réellement distinctes, même proches (ex. « Naruto » et « Boruto », « Harry Potter 1 » et « Harry Potter 2 »). Réponds uniquement en JSON : {\"doublon\": <index numérique de la proposition existante identique, ou null>}." },
            { role: "user", content: JSON.stringify({ nouvelle: text, existantes: list }) }
          ]
        })
      });
      if (!res.ok) throw new Error(res.status);
      const j = await res.json();
      const idx = JSON.parse(j.choices[0].message.content).doublon;
      return Number.isInteger(idx) && list[idx] !== undefined ? list[idx] : null;
    } catch (err) {
      console.warn("Vérification IA indisponible :", err);
      aiError = String(err.message || err);
      return null;
    } finally { clearTimeout(timer); }
  }

  propForm.addEventListener('submit', e => {
    e.preventDefault();
    const text = propInput.value.trim();
    if (!text) return;
    withLock(async () => {
      const data = await fetchData();
      if (!data || data.tire) return;
      toast("Vérification…");
      const dup = await findDuplicate(text, data.propositions);
      if (dup) {
        toast("Déjà proposé : « " + dup + " »", true);
        return;
      }
      data.propositions.push(text);
      if (await saveData(data)) {
        propInput.value = "";
        toast(aiError ? "Ajoutée, mais la vérification IA a échoué (" + aiError + ")" : "Proposition ajoutée.", !!aiError);
      }
    });
  });

  drawBtn.addEventListener('click', () => {
    withLock(async () => {
      const data = await fetchData();
      if (!data) return;
      if (data.tire) return toast("Le tirage a déjà été effectué.", true);
      if (data.propositions.length === 0) return toast("Ajoutez au moins une proposition avant de tirer.", true);

      // Défilement qui ralentit, comme une roue de loterie
      const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
      stage.className = "stage rolling";
      stageLabel.textContent = "Tirage en cours…";
      const steps = calm ? 0 : 22;
      for (let i = 0; i < steps; i++) {
        winnerName.textContent = data.propositions[Math.floor(Math.random() * data.propositions.length)];
        stage.classList.remove("rolling"); void stage.offsetWidth; stage.classList.add("rolling");
        await new Promise(r => setTimeout(r, 55 + i * i * 0.7));
      }

      data.gagnant = data.propositions[Math.floor(Math.random() * data.propositions.length)];
      data.tire = true;
      await saveData(data);
      lastSnapshot = "";
      prevTire = false; // déclenche les confettis au rendu
    });
  });

  // Confettis (un seul moment fort : l'annonce du gagnant)
  function burst() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = $('confetti'), ctx = cv.getContext('2d');
    cv.width = innerWidth; cv.height = innerHeight;
    const colors = ['#ffc65c', '#ff5d8f', '#6ee7c8', '#f6f1ff'];
    const parts = Array.from({ length: 140 }, () => ({
      x: cv.width / 2, y: cv.height * 0.3,
      vx: (Math.random() - .5) * 15, vy: Math.random() * -13 - 3,
      s: 5 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      c: colors[Math.floor(Math.random() * colors.length)]
    }));
    let t = 0;
    (function frame() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      parts.forEach(p => {
        p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
      });
      if (++t < 170) requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
    })();
  }

  setInterval(updateUI, 3000);
  updateUI();
</script>
</body>
</html>
