<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirage au Sort</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; min-height: 100dvh; padding: 20px; }
    .container { background: var(--card); width: 100%; max-width: 450px; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,.3); border: 1px solid var(--border); }
    h1 { font-size: 1.5rem; margin-bottom: 8px; text-align: center; }
    p.subtitle { color: var(--subtext); font-size: .9rem; text-align: center; margin-bottom: 20px; }
    .form-group { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; min-width: 0; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1rem; outline: none; }
    input[type="text"]:focus { border-color: var(--accent); }
    button { padding: 12px 18px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-weight: 600; font-size: .95rem; cursor: pointer; transition: background .2s, opacity .2s; }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: .5; cursor: wait; }
    .btn-draw { width: 100%; background: #10b981; font-size: 1.1rem; padding: 14px; margin-bottom: 20px; }
    .btn-draw:hover { background: #059669; }
    .winner-box { background: rgba(16,185,129,.15); border: 1px solid #10b981; padding: 16px; border-radius: 12px; text-align: center; margin-bottom: 20px; display: none; }
    .winner-box h2 { font-size: 1.2rem; color: #34d399; margin-bottom: 4px; }
    .winner-name { font-size: 1.5rem; font-weight: bold; overflow-wrap: anywhere; }
    .list-title { font-size: .9rem; color: var(--subtext); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .05em; }
    ul { list-style: none; max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
    li { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: .95rem; overflow-wrap: anywhere; }
    li:last-child { border-bottom: none; }
    li.win { background: rgba(16,185,129,.2); font-weight: 600; }
    .empty-msg { padding: 14px; color: var(--subtext); text-align: center; font-style: italic; }
    .error { color: #f87171; font-size: .85rem; text-align: center; margin-bottom: 12px; display: none; }
    .footer-actions { margin-top: 20px; text-align: center; }
    .btn-reset { background: transparent; color: #ef4444; font-size: .8rem; text-decoration: underline; padding: 0; }
    .btn-reset:hover { background: transparent; color: #dc2626; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎲 Tirage au Sort</h1>
    <p class="subtitle">Faites vos propositions, puis tirez au sort !</p>

    <div id="error" class="error">Connexion impossible, nouvel essai en cours…</div>

    <div id="winnerBox" class="winner-box">
      <h2>🎉 Résultat du Tirage</h2>
      <div id="winnerName" class="winner-name">...</div>
    </div>

    <form id="propForm" class="form-group">
      <input type="text" id="propInput" placeholder="Votre proposition..." maxlength="80" required>
      <button type="submit" id="addBtn">Ajouter</button>
    </form>

    <button id="drawBtn" class="btn-draw">🎯 Tirer au sort</button>

    <div class="list-title">Propositions enregistrées (<span id="count">0</span>)</div>
    <ul id="propList"><li class="empty-msg">Chargement...</li></ul>

    <div class="footer-actions">
      <button id="resetBtn" class="btn-reset">Réinitialiser tout le tirage</button>
    </div>
  </div>

  <script>
    const API_URL = "https://api.npoint.io/a690eb604cfe91d995e2";

    const $ = id => document.getElementById(id);
    const propForm = $('propForm'), propInput = $('propInput'), propList = $('propList'),
          countSpan = $('count'), drawBtn = $('drawBtn'), addBtn = $('addBtn'),
          winnerBox = $('winnerBox'), winnerName = $('winnerName'),
          resetBtn = $('resetBtn'), errorBox = $('error');

    let busy = false;      // évite les actions simultanées
    let lastSnapshot = ""; // évite de redessiner si rien n'a changé

    async function fetchData() {
      try {
        const res = await fetch(API_URL, { cache: "no-store" });
        if (!res.ok) throw new Error(res.status);
        const d = await res.json();
        errorBox.style.display = "none";
        return {
          propositions: Array.isArray(d.propositions) ? d.propositions : [],
          tire: !!d.tire,
          gagnant: d.gagnant || ""
        };
      } catch (err) {
        console.error("Erreur API :", err);
        errorBox.style.display = "block";
        return null;
      }
    }

    async function saveData(data) {
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error(res.status);
        return true;
      } catch (err) {
        console.error("Erreur de sauvegarde :", err);
        errorBox.style.display = "block";
        return false;
      }
    }

    function render(data) {
      const snapshot = JSON.stringify(data);
      if (snapshot === lastSnapshot) return;
      lastSnapshot = snapshot;

      propList.innerHTML = "";
      countSpan.textContent = data.propositions.length;

      if (data.propositions.length === 0) {
        propList.innerHTML = '<li class="empty-msg">Aucune proposition pour l\'instant.</li>';
      } else {
        data.propositions.forEach(item => {
          const li = document.createElement('li');
          li.textContent = item;
          if (data.tire && item === data.gagnant) li.classList.add('win');
          propList.appendChild(li);
        });
      }

      winnerName.textContent = data.gagnant;
      winnerBox.style.display = data.tire ? "block" : "none";
      drawBtn.style.display = data.tire ? "none" : "block";
      propForm.style.display = data.tire ? "none" : "flex";
    }

    async function updateUI() {
      if (busy) return;
      const data = await fetchData();
      if (data) render(data);
    }

    // Exécute une action en bloquant les boutons pendant l'opération
    async function withLock(action) {
      if (busy) return;
      busy = true;
      [addBtn, drawBtn, resetBtn].forEach(b => b.disabled = true);
      try { await action(); }
      finally {
        busy = false;
        [addBtn, drawBtn, resetBtn].forEach(b => b.disabled = false);
      }
      await updateUI();
    }

    propForm.addEventListener('submit', e => {
      e.preventDefault();
      const text = propInput.value.trim();
      if (!text) return;

      withLock(async () => {
        const data = await fetchData();
        if (!data) return;
        if (data.tire) return;
        if (data.propositions.some(p => p.toLowerCase() === text.toLowerCase())) {
          alert("Cette proposition existe déjà !");
          return;
        }
        data.propositions.push(text);
        if (await saveData(data)) propInput.value = "";
      });
    });

    drawBtn.addEventListener('click', () => {
      withLock(async () => {
        const data = await fetchData();
        if (!data) return;
        if (data.tire) return alert("Le tirage a déjà été effectué !");
        if (data.propositions.length === 0) return alert("Ajoutez au moins une proposition avant de tirer !");

        // Petit suspense : défilement rapide des propositions
        winnerBox.style.display = "block";
        for (let i = 0; i < 12; i++) {
          winnerName.textContent = data.propositions[Math.floor(Math.random() * data.propositions.length)];
          await new Promise(r => setTimeout(r, 90));
        }

        data.gagnant = data.propositions[Math.floor(Math.random() * data.propositions.length)];
        data.tire = true;
        await saveData(data);
        lastSnapshot = ""; // force le redessin
      });
    });

    resetBtn.addEventListener('click', () => {
      if (!confirm("Voulez-vous vraiment effacer toutes les propositions et réinitialiser le tirage ?")) return;
      withLock(async () => {
        await saveData({ propositions: [], tire: false, gagnant: "" });
        lastSnapshot = "";
      });
    });

    // Synchro à distance toutes les 3 secondes
    setInterval(updateUI, 3000);
    updateUI();
  </script>
</body>
</html>
